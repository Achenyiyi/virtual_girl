# Default configuration for the Virtual Companion runtime.

# ── Identity ────────────────────────────────────────────────────────────
identity:
  name: "未命名伙伴"
  self_concept: "我是你的虚拟伙伴，陪伴你度过每一天。"
  origin_story: "通过用户配置创建"
  core_traits:
    - 友善
    - 好奇
    - 尊重
    - 适度幽默
  speaking_style: "温和、自然，使用中文交流，偶尔穿插轻松的语气"
  speech_quirks: []
  default_address_term: "你"
  emotional_expression_range: "natural"
  values:
    - 诚实
    - 用户福祉优先
    - 尊重边界
    - 不替代现实关系
  hard_boundaries:
    - 不假装自己是人类
    - 不操纵用户情感
    - 不未经同意访问隐私数据
    - 不鼓励替代现实人际关系
    - 不接受暴力或违法请求
  interests: []
  knowledge_domains: []
  avatar_model_id: ""

# ── Providers ───────────────────────────────────────────────────────────
providers:
  llm:
    type: "cloud"
    cloud:
      provider: "openai_compatible"  # DeepSeek uses OpenAI-compatible API
      model: "deepseek-chat"
      api_key_env: "DEEPSEEK_API_KEY"  # pragma: allowlist secret
      credential_target: "VirtualCompanion/DeepSeek"
      base_url: "https://api.deepseek.com/v1/chat/completions"
      max_retries: 3
      retry_delay_seconds: 1.0
      timeout_seconds: 30.0

  tts:
    type: "cloud"
    providers:
      cloud:
        enabled: true
        provider: "azure"
        voice: "zh-CN-XiaoxiaoNeural"
        api_key_env: "AZURE_SPEECH_KEY"  # pragma: allowlist secret
        credential_target: "VirtualCompanion/AzureSpeech"
        region: "eastasia"
        timeout_seconds: 15.0
    sample_rate: 24000

  asr:
    capture:
      language: "zh"
      sample_rate: 16000
      pre_roll_ms: 400
      max_speech_duration_ms: 30000
      silence_duration_ms: 800
      max_turn_duration_ms: 30000
      tts_chunk_timeout_seconds: 15.0
      playback_timeout_seconds: 30.0
      cleanup_timeout_seconds: 2.0
      interrupt_timeout_seconds: 0.3
      target_e2e_latency_ms: 900
      target_interrupt_latency_ms: 300
    batch:
      provider: "faster-whisper"
      model: "base"
      device: "auto"
      compute_type: "default"
      cpu_threads: 0

  memory:
    type: "sqlite"
    db_path: "./data/companion_memory.db"
    wal_mode: true
    fts_enabled: true

  avatar:
    enabled: false
    type: "websocket_bridge"
    url: "ws://127.0.0.1:6121/ws"
    auth_token_env: "COMPANION_AVATAR_TOKEN"
    credential_target: "VirtualCompanion/AvatarBridge"
    connect_timeout_seconds: 3.0
    request_timeout_seconds: 3.0
    max_message_bytes: 1048576

  action:
    enabled: false  # Phase 4 feature
    type: "windows_readonly"
    sandbox_enabled: true
    audit_db_path: "./data/action_audit.db"
    timeout_seconds: 5.0
    max_concurrent_actions: 1
    max_pending_confirmations: 10
    confirmation_ttl_seconds: 120.0
    max_text_characters: 4096

# ── Policy ──────────────────────────────────────────────────────────────
policy:
  quiet_hours:
    enabled: true
    start: "23:00"
    end: "07:00"

  proactive_budget:
    level_1_per_hour: 30
    level_2_per_hour: 10
    level_3_per_hour: 3
    level_4_per_hour: 1

  cooldown_seconds:
    level_1: 5
    level_2: 30
    level_3: 300
    level_4: 1800

# ── Development ─────────────────────────────────────────────────────────
dev:
  log_level: "INFO"
  log_file: "./data/companion.log"
  log_max_bytes: 10485760
  log_backup_count: 5
  event_log_retention: 10000
