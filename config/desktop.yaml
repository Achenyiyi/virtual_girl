# Default configuration for the Virtual Companion runtime.

# Relative databases and logs belong in the current user's local application data.
runtime:
  data_root: "user_local"

# ── Identity ────────────────────────────────────────────────────────────
identity:
  name: "未命名伙伴"
  self_concept: "我是你的虚拟伙伴，陪伴你度过每一天。"
  origin_story: "通过用户配置创建"
  core_traits:
    - 友善
    - 好奇
    - 尊重
    - 适度幽默
  speaking_style: "温和、自然，使用中文交流，偶尔穿插轻松的语气"
  speech_quirks: []
  default_address_term: "你"
  emotional_expression_range: "natural"
  values:
    - 诚实
    - 用户福祉优先
    - 尊重边界
    - 不替代现实关系
  hard_boundaries:
    - 不假装自己是人类
    - 不操纵用户情感
    - 不未经同意访问隐私数据
    - 不鼓励替代现实人际关系
    - 不接受暴力或违法请求
  interests: []
  knowledge_domains: []
  avatar_model_id: "managed-nemesia-pajamas"

# ── Providers ───────────────────────────────────────────────────────────
providers:
  llm:
    type: "cloud"
    cloud:
      provider: "openai_compatible"  # DeepSeek uses OpenAI-compatible API
      model: "deepseek-chat"
      api_key_env: "DEEPSEEK_API_KEY"  # pragma: allowlist secret
      credential_target: "VirtualCompanion/DeepSeek"
      base_url: "https://api.deepseek.com/v1/chat/completions"
      max_retries: 3
      retry_delay_seconds: 1.0
      timeout_seconds: 30.0

  tts:
    type: "cloud"
    providers:
      cloud:
        enabled: true
        provider: "fish_audio"
        model: "s2.1-pro-free"
        reference_id: "7f92f8afb8ec43bf81429cc1c9199cb1"  # AD学姐
        api_key_env: "FISH_API_KEY"  # pragma: allowlist secret
        credential_target: "VirtualCompanion/FishAudio"
        base_url: "https://api.fish.audio"
        latency: "balanced"
        temperature: 0.7
        top_p: 0.7
        chunk_length: 180
        min_chunk_length: 30
        max_new_tokens: 1024
        repetition_penalty: 1.2
        condition_on_previous_chunks: true
        early_stop_threshold: 1.0
        max_text_bytes: 480
        timeout_seconds: 15.0
    sample_rate: 24000

  asr:
    capture:
      language: "zh"
      sample_rate: 16000
      pre_roll_ms: 400
      max_speech_duration_ms: 30000
      silence_duration_ms: 800
      max_turn_duration_ms: 120000
      tts_chunk_timeout_seconds: 15.0
      playback_timeout_seconds: 120.0
      cleanup_timeout_seconds: 2.0
      interrupt_timeout_seconds: 0.3
      target_e2e_latency_ms: 30000
      target_interrupt_latency_ms: 300
    batch:
      provider: "faster-whisper"
      model: "base"
      device: "auto"
      compute_type: "default"
      cpu_threads: 0

  memory:
    type: "sqlite"
    db_path: "./data/companion_memory.db"
    wal_mode: true
    fts_enabled: true

  avatar:
    enabled: true
    type: "websocket_bridge"
    url: "ws://127.0.0.1:6122/ws"
    auth_token_env: "COMPANION_AVATAR_TOKEN"
    credential_target: "VirtualCompanion/AvatarBridge"
    connect_timeout_seconds: 3.0
    request_timeout_seconds: 3.0
    max_message_bytes: 1048576
    launch:
      enabled: true
      executable_path: "E:\\桌面\\feishu\\desktop-client-dist\\airi.exe"
      expected_sha256: "1f73b5880616e357edba7eacdfe4cb8bc3e4f67eacca08035d68bf9bb931775f"
      expected_app_asar_sha256: "f8b56abd8e28d2f591ed4510861be361c6a4c16b0ffc09fa333f2ccf54015fcd"
      expected_godot_sha256: "d60d4af2f5c96f6afc643d8412fa7e2ead6a22fc40bc5a66a526147f8ed9027f"
      model_path: "E:\\桌面\\feishu\\model\\8496491754682859078.vrm"
      expected_model_sha256: "6c093fb4e37cda43e2bc89df36c9a93d1f42741fbd6ea7dd57a893e32a6fe31d"
      model_id: "managed-nemesia-pajamas"
      model_name: "Managed VRM avatar"
      startup_timeout_seconds: 30.0
      shutdown_timeout_seconds: 8.0

  action:
    enabled: false  # Phase 4 feature
    type: "windows_readonly"
    sandbox_enabled: true
    audit_db_path: "./data/action_audit.db"
    timeout_seconds: 5.0
    max_concurrent_actions: 1
    max_pending_confirmations: 10
    confirmation_ttl_seconds: 120.0
    max_text_characters: 4096

# ── Policy ──────────────────────────────────────────────────────────────
policy:
  quiet_hours:
    enabled: true
    start: "23:00"
    end: "07:00"

  proactive_budget:
    level_1_per_hour: 30
    level_2_per_hour: 10
    level_3_per_hour: 3
    level_4_per_hour: 1

  cooldown_seconds:
    level_1: 5
    level_2: 30
    level_3: 300
    level_4: 1800

# ── Development ─────────────────────────────────────────────────────────
dev:
  log_level: "INFO"
  log_file: "./data/companion.log"
  log_max_bytes: 10485760
  log_backup_count: 5
  event_log_retention: 10000
