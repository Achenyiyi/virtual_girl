name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked runtime and quality tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip install --disable-pip-version-check --no-deps .
          python -m pip install --disable-pip-version-check ".[dev,release]"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Lint
        run: ruff check companion tests

      - name: Type check
        run: mypy companion

      - name: Test with coverage gate
        run: pytest -q --cov=companion --cov-report=term --cov-fail-under=70

      - name: Scan release sources for secrets
        run: |
          detect-secrets scan companion config docs README.md pyproject.toml requirements.txt .github > secret-scan.json
          python -c "import json; d=json.load(open('secret-scan.json', encoding='utf-8')); n=sum(map(len, d.get('results', {}).values())); print(f'secret candidates: {n}'); raise SystemExit(n > 0)"

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.lock

      - name: Build release artifacts
        run: python -m build
