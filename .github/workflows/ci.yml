name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Node for AIRI bridge checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integrations/airi-v0.11.3/package-lock.json

      - name: Install locked runtime and quality tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip install --disable-pip-version-check --no-deps .

      - name: Check dependency consistency
        run: python -m pip check

      - name: Verify source version consistency
        run: python scripts/verify_release_version.py

      - name: Validate packaged production configuration
        run: python -m companion --validate-config

      - name: Lint
        run: ruff check companion tests scripts

      - name: Type check
        run: mypy companion scripts

      - name: Verify pinned AIRI patch applies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $airiCheckout = Join-Path $env:RUNNER_TEMP "airi-v0.11.3"
          New-Item -ItemType Directory -Path $airiCheckout | Out-Null
          git -C $airiCheckout init
          git -C $airiCheckout remote add origin https://github.com/moeru-ai/airi.git
          git -C $airiCheckout fetch --depth=1 origin dbf812488829a61cc2e95909e021b215704d066c
          git -C $airiCheckout checkout --detach FETCH_HEAD
          git -C $airiCheckout apply --check "$env:GITHUB_WORKSPACE\integrations\airi-v0.11.3\airi-v0.11.3-avatar-bridge.patch"

      - name: Verify AIRI bridge protocol core
        working-directory: integrations/airi-v0.11.3
        run: |
          npm ci --ignore-scripts
          npm test
          npm run typecheck

      - name: Test with coverage gate
        run: pytest -q --cov=companion --cov-report=term --cov-fail-under=70

      - name: Scan release sources for secrets
        run: |
          detect-secrets scan --exclude-lines '(?i)("(?:sha256|[a-z0-9_]+_sha(?:256|512)|airi_commit)"\s*:|\$AiriCommit\s*=)' companion config docs integrations scripts README.md pyproject.toml requirements.lock MANIFEST.in .github > secret-scan.json
          python -c "import json; d=json.load(open('secret-scan.json', encoding='utf-8')); n=sum(map(len, d.get('results', {}).values())); print(f'secret candidates: {n}'); raise SystemExit(n > 0)"

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.lock

      - name: Build release artifacts
        run: python -m build --no-isolation

      - name: Verify release artifact contents
        run: python scripts/verify_release_artifacts.py dist

      - name: Test the built wheel in isolation
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\release-venv"
          & "$env:RUNNER_TEMP\release-venv\Scripts\python.exe" -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = (Get-ChildItem dist\*.whl -File | Select-Object -First 1).FullName
          & "$env:RUNNER_TEMP\release-venv\Scripts\python.exe" -m pip install --disable-pip-version-check --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\release-venv\Scripts\python.exe" -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $env:RUNNER_TEMP
          try {
            & "$env:RUNNER_TEMP\release-venv\Scripts\python.exe" -c "from companion.config_loader import RuntimeConfig; RuntimeConfig.from_yaml(); import companion; print(companion.__version__)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & "$env:RUNNER_TEMP\release-venv\Scripts\companion.exe" --help
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: virtual-companion-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
