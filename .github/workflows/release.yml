name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-runtime.lock

      - name: Require verified signed tag on main with prior green CI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $refJson = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Unable to inspect the release tag ref" }
          $ref = $refJson | ConvertFrom-Json
          if ($ref.object.type -cne "tag") {
            throw "Release ref must be an annotated signed tag"
          }
          $tagJson = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($ref.object.sha)"
          if ($LASTEXITCODE -ne 0) { throw "Unable to inspect the release tag object" }
          $tagObject = $tagJson | ConvertFrom-Json
          if (
            $tagObject.tag -cne $tag -or
            $tagObject.object.type -cne "commit" -or
            $tagObject.object.sha -cne $env:GITHUB_SHA -or
            $tagObject.verification.verified -ne $true
          ) {
            throw "Release tag must directly target this commit and have a GitHub-verified signature"
          }
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$env:GITHUB_SHA" origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tag is not on main" }
          $runs = gh run list --repo "$env:GITHUB_REPOSITORY" --workflow CI --commit "$env:GITHUB_SHA" --event push --limit 20 --json status,conclusion,headBranch | ConvertFrom-Json
          $passed = $runs | Where-Object { $_.headBranch -eq "main" -and $_.status -eq "completed" -and $_.conclusion -eq "success" }
          if (-not $passed) { throw "Tagged commit has no prior successful main CI run" }

      - name: Install locked release tools
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock

      - name: Verify release version and external evidence
        run: |
          python scripts/verify_release_version.py --tag "${{ github.ref_name }}"
          python scripts/verify_release_evidence.py --tag "${{ github.ref_name }}"

      - name: Download the signed installer from the staging draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $evidencePath = Join-Path "release-evidence" "$tag\windows-installer.json"
          $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          $sourceCommit = $evidence.source_commit
          git cat-file -e "$sourceCommit^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "Installer source commit is unavailable" }
          git merge-base --is-ancestor $sourceCommit "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw "Installer source is not an ancestor of the tag" }
          $allowedPrefix = "release-evidence/$tag/"
          $postBuildChanges = @(git diff --name-only $sourceCommit "$env:GITHUB_SHA")
          $unexpectedChanges = @(
            $postBuildChanges | Where-Object { -not $_.StartsWith($allowedPrefix) }
          )
          if ($unexpectedChanges.Count -ne 0) {
            throw "Source changed after the installer build: $($unexpectedChanges -join ', ')"
          }
          $draftJson = gh release view $tag --repo "$env:GITHUB_REPOSITORY" --json isDraft,isImmutable,targetCommitish,assets
          if ($LASTEXITCODE -ne 0) {
            throw "A Draft Release containing the signed installer must exist before the tag is pushed"
          }
          $draft = $draftJson | ConvertFrom-Json
          if (-not $draft.isDraft -or $draft.isImmutable) {
            throw "The staged Release must still be a mutable draft"
          }
          if ($draft.targetCommitish -cne $sourceCommit) {
            throw "The staged Release target does not match the installer source commit"
          }
          $installerName = $evidence.installer.filename
          $stagedAssets = @($draft.assets)
          if ($stagedAssets.Count -ne 1) {
            throw "The staged draft must contain exactly the evidenced Windows installer"
          }
          $stagedInstaller = $stagedAssets[0]
          if (
            $stagedInstaller.name -cne $installerName -or
            $stagedInstaller.state -cne "uploaded" -or
            $stagedInstaller.size -ne $evidence.installer.size_bytes -or
            $stagedInstaller.digest -cne "sha256:$($evidence.installer.sha256)"
          ) {
            throw "The staged installer metadata does not match windows-installer.json"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          gh release download $tag --repo "$env:GITHUB_REPOSITORY" --pattern $installerName --dir dist
          if ($LASTEXITCODE -ne 0) { throw "Signed installer download failed" }
          $installerPath = (Resolve-Path -LiteralPath (Join-Path dist $installerName)).Path
          $actualSize = (Get-Item -LiteralPath $installerPath).Length
          $actualSha256 = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSize -ne $evidence.installer.size_bytes -or $actualSha256 -cne $evidence.installer.sha256) {
            throw "Staged installer does not match windows-installer.json"
          }
          "WINDOWS_INSTALLER_PATH=$installerPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_INSTALLER_NAME=$installerName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_INSTALLER_SOURCE_COMMIT=$sourceCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Reverify installer signature and install lifecycle
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.Substring(1)
          .\scripts\verify_windows_installer.ps1 `
            -InstallerPath $env:WINDOWS_INSTALLER_PATH `
            -AppVersion $version `
            -SourceCommit $env:WINDOWS_INSTALLER_SOURCE_COMMIT `
            -StageEvidenceJson "release-evidence\$tag\windows-stage.json" `
            -ExpectedEvidenceJson "release-evidence\${{ github.ref_name }}\windows-installer.json"

      - name: Validate packaged production configuration
        run: python -m companion --validate-config

      - name: Build and verify release artifacts
        shell: pwsh
        run: |
          python -m build --no-isolation
          python scripts/verify_release_artifacts.py dist --installer $env:WINDOWS_INSTALLER_PATH
          $wheel = (Get-ChildItem dist\*.whl -File | Select-Object -First 1).FullName
          python scripts/verify_release_version.py --tag "${{ github.ref_name }}" --wheel $wheel

      - name: Attest release artifacts
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.exe
            dist/SHA256SUMS

      - name: Publish complete immutable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.Substring(1)
          function Get-ExpectedAsset([string]$Path) {
            $item = Get-Item -LiteralPath $Path
            [pscustomobject]@{
              name = $item.Name
              size = $item.Length
              digest = "sha256:$((Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
            }
          }
          function Assert-ReleaseAssets(
            [object[]]$Assets,
            [Collections.Generic.Dictionary[string, object]]$Expected,
            [string]$Context
          ) {
            $actualAssets = @($Assets)
            if ($actualAssets.Count -ne $Expected.Count) {
              throw "$Context asset count differs from the verified local set"
            }
            foreach ($asset in $actualAssets) {
              if (-not $Expected.ContainsKey([string]$asset.name)) {
                throw "$Context contains an unexpected asset: $($asset.name)"
              }
              $verified = $Expected[[string]$asset.name]
              if (
                $asset.name -cne $verified.name -or
                $asset.state -cne "uploaded" -or
                $asset.size -ne $verified.size -or
                $asset.digest -cne $verified.digest
              ) {
                throw "$Context asset metadata differs: $($asset.name)"
              }
            }
          }

          $wheel = (Get-ChildItem "dist\virtual_companion-$version-*.whl" -File -ErrorAction Stop).FullName
          $sdist = (Get-Item -LiteralPath "dist\virtual_companion-$version.tar.gz").FullName
          $checksums = (Get-Item -LiteralPath "dist\SHA256SUMS").FullName
          $expectedAssets = [Collections.Generic.Dictionary[string, object]]::new(
            [StringComparer]::Ordinal
          )
          foreach ($path in @($env:WINDOWS_INSTALLER_PATH, $wheel, $sdist, $checksums)) {
            $asset = Get-ExpectedAsset $path
            $expectedAssets.Add($asset.name, $asset)
          }
          $installerOnly = [Collections.Generic.Dictionary[string, object]]::new(
            [StringComparer]::Ordinal
          )
          $installerOnly.Add(
            $env:WINDOWS_INSTALLER_NAME,
            $expectedAssets[$env:WINDOWS_INSTALLER_NAME]
          )
          try {
            $existingJson = gh release view $tag --repo "$env:GITHUB_REPOSITORY" --json isDraft,isImmutable,targetCommitish,assets
            if ($LASTEXITCODE -ne 0) { throw "The verified staging draft disappeared" }
            $existing = $existingJson | ConvertFrom-Json
            if (
              -not $existing.isDraft -or
              $existing.isImmutable -or
              $existing.targetCommitish -cne $env:WINDOWS_INSTALLER_SOURCE_COMMIT
            ) {
              throw "The verified staging release is no longer a mutable draft"
            }
            Assert-ReleaseAssets $existing.assets $installerOnly "Staging draft"
            gh release upload $tag `
              dist\*.whl `
              dist\*.tar.gz `
              dist\SHA256SUMS `
              --repo "$env:GITHUB_REPOSITORY"
            if ($LASTEXITCODE -ne 0) { throw "Verified artifact upload failed" }
            $draftJson = gh release view $tag --repo "$env:GITHUB_REPOSITORY" --json isDraft,isImmutable,targetCommitish,assets
            if ($LASTEXITCODE -ne 0) { throw "Unable to inspect the complete draft" }
            $draft = $draftJson | ConvertFrom-Json
            if (
              -not $draft.isDraft -or
              $draft.isImmutable -or
              $draft.targetCommitish -cne $env:WINDOWS_INSTALLER_SOURCE_COMMIT
            ) {
              throw "Draft release asset set is incomplete"
            }
            Assert-ReleaseAssets $draft.assets $expectedAssets "Complete draft"
            gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --draft=false --latest
            if ($LASTEXITCODE -ne 0) { throw "Draft release publication failed" }
            $release = $null
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              $releaseJson = gh release view $tag --repo "$env:GITHUB_REPOSITORY" --json isDraft,isImmutable,assets
              if ($LASTEXITCODE -ne 0) { throw "Unable to inspect the published release" }
              $release = $releaseJson | ConvertFrom-Json
              if ($release.isImmutable) { break }
              if ($attempt -lt 5) { Start-Sleep -Seconds 2 }
            }
            if ($release.isDraft -or -not $release.isImmutable) {
              throw "Published release is mutable or its asset set changed"
            }
            Assert-ReleaseAssets $release.assets $expectedAssets "Immutable release"
          } catch {
            $failure = $_.Exception.Message
            throw "Release publication failed closed and left the draft for inspection. Verify release immutability and the staged asset set before retrying. $failure"
          }
