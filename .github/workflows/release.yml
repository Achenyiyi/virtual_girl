name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Require tag commit on main with prior green CI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$env:GITHUB_SHA" origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tag is not on main" }
          $runs = gh run list --repo "$env:GITHUB_REPOSITORY" --workflow CI --commit "$env:GITHUB_SHA" --event push --limit 20 --json status,conclusion,headBranch | ConvertFrom-Json
          $passed = $runs | Where-Object { $_.headBranch -eq "main" -and $_.status -eq "completed" -and $_.conclusion -eq "success" }
          if (-not $passed) { throw "Tagged commit has no prior successful main CI run" }

      - name: Install locked release tools
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock

      - name: Verify release version and external evidence
        run: |
          python scripts/verify_release_version.py --tag "${{ github.ref_name }}"
          python scripts/verify_release_evidence.py --tag "${{ github.ref_name }}"

      - name: Build and verify release artifacts
        shell: pwsh
        run: |
          python -m build --no-isolation
          python scripts/verify_release_artifacts.py dist
          $wheel = (Get-ChildItem dist\*.whl -File | Select-Object -First 1).FullName
          python scripts/verify_release_version.py --tag "${{ github.ref_name }}" --wheel $wheel

      - name: Attest release artifacts
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Publish immutable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* --repo "$env:GITHUB_REPOSITORY" --verify-tag --title "Virtual Companion ${{ github.ref_name }}" --generate-notes
